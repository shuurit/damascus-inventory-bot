name: Inventory Check

on:
  # Scheduling is handled externally via cron-job.org calling the
  # workflow_dispatch API below — GitHub's own `schedule:` trigger was
  # confirmed unreliable for this repo (never fired even once after 24h+).
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run inventory check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_inventory.py
