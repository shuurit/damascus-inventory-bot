name: Inventory Check

on:
  schedule:
    # ~1:33 PM America/Denver (MDT, UTC-6) — offset from :30 to avoid top-of-half-hour queueing
    - cron: "33 19 * * *"
    # ~8:07 PM America/Denver (MDT, UTC-6) — offset from :00 to avoid top-of-hour queueing
    - cron: "7 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run inventory check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_inventory.py
